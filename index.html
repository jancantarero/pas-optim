<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PasÒptim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef2;--ink:#14202b;--mut:#5b6b79;--card:#fff;--ac:#2447f5;--ok:#1f9d6b;--mid:#e59a00;--bad:#d62e3a;--line:#cfd8e0}
@media(prefers-color-scheme:dark){:root{--bg:#10171e;--ink:#e8eef3;--mut:#93a4b3;--card:#18222c;--ac:#6f8cff;--line:#2a3845}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
.w{max-width:1040px;margin:0 auto;padding:0 20px}
h1{font-size:clamp(2.4rem,7vw,4.6rem);line-height:.98;font-weight:800;letter-spacing:-.03em;margin:28px 0 16px;max-width:14ch}
h2{font-size:1.5rem;margin:48px 0 14px;letter-spacing:-.01em}
.lead{font-size:1.15rem;color:var(--mut);max-width:60ch;margin:0 0 28px}
.bar0{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:28px}
.bar0 img{width:170px;height:auto;border-radius:18px;background:#fff;padding:8px;display:block}
.lang{display:flex;gap:4px;background:var(--card);border-radius:999px;padding:4px}
.lang button{font:inherit;font-weight:700;font-size:.85rem;border:0;border-radius:999px;padding:6px 14px;background:none;color:var(--ink);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.form{background:var(--card);border-radius:18px;padding:18px 20px;margin:0 0 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}
.form label{display:flex;flex-direction:column;font-size:.9rem;color:var(--mut);gap:4px}
.form input,.form select{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.form .full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:4px}
.checks label{flex-direction:row;align-items:center;gap:6px;color:var(--ink)}
.checks input{width:auto}
.stage{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:800px){.stage,.form{grid-template-columns:1fr}}
.slot{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:14px}
.slot b{display:block;font-size:1.05rem}.slot small{color:var(--mut)}
.vw{position:relative;margin-top:10px;border-radius:12px;overflow:hidden;background:#0003;aspect-ratio:3/4;display:none}
.vw.on{display:block}
.vw video,.vw canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pick{display:inline-block;margin-top:8px;padding:9px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer}
.pick:focus-within,button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.tips{color:var(--mut);font-size:.95rem;margin:16px 0}
.consent{margin:14px 0;display:flex;flex-direction:column;gap:8px;font-size:.95rem}
.consent label{display:flex;gap:8px;align-items:flex-start}
button#go{font:inherit;font-weight:700;font-size:1.05rem;border:0;border-radius:14px;padding:14px 28px;background:var(--ac);color:#fff;cursor:pointer}
button#go:disabled{opacity:.4;cursor:not-allowed}
.bar{height:8px;border-radius:9px;background:var(--line);margin-top:14px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
#st{color:var(--mut);margin-top:8px;min-height:1.5em}
#res{display:none}
.top{display:flex;gap:28px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:22px;padding:24px}
.ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring span{width:98px;height:98px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:2.2rem;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.chip{font-size:.85rem;padding:3px 10px;border-radius:999px;background:var(--bg)}
.fich{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:800px){.fich{grid-template-columns:1fr 1fr}}
.fich div{background:var(--card);border-radius:14px;padding:12px 14px}
.fich small{display:block;color:var(--mut);font-size:.8rem}
.f{background:var(--card);border-radius:16px;padding:20px 22px;margin:12px 0;border-left:8px solid var(--mid)}
.f.s2{border-color:var(--bad)}
.f h3{margin:0;font-size:1.2rem}.f .v{color:var(--mut);font-size:.95rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin-top:10px}
@media(max-width:700px){.cols{grid-template-columns:1fr}}
.f h4{margin:10px 0 2px;font-size:.95rem}.f ul{margin:0;padding-left:18px}
.hit{display:inline-block;margin-left:8px;font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--ac);color:#fff;vertical-align:middle}
.note{background:var(--card);border-left:8px solid var(--ac);border-radius:14px;padding:14px 18px;margin:12px 0;font-size:.95rem}
.shoe{background:var(--ink);color:var(--bg);border-radius:22px;padding:26px}
.shoe h3{margin:0 0 6px;font-size:1.6rem}
.ghost{font:inherit;background:none;border:2px solid var(--ink);color:var(--ink);border-radius:12px;padding:8px 16px;cursor:pointer;margin-top:14px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;font-size:.95rem}
td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
.src{color:var(--mut);font-size:.85rem}
footer{color:var(--mut);font-size:.9rem;margin:48px 0;border-top:1px solid var(--line);padding-top:18px}
</style>
</head>
<body>
<div class="w">
<div class="bar0"><img src="logo.png" alt="PasÒptim"><div class="lang" role="group" aria-label="Idioma / Language"><button>CA</button><button>ES</button><button>EN</button></div></div>
<h1 data-t="h1"></h1>
<p class="lead" data-t="lead"></p>

<div class="form">
 <label><span data-t="f_act"></span><select id="act"><option value="0" data-t="o_walk"></option><option value="1" data-t="o_run"></option><option value="2" data-t="o_both"></option></select></label>
 <label><span data-t="f_age"></span><input type="number" id="age" min="8" max="99" data-ph="ph_age"></label>
 <label><span data-t="f_sex"></span><select id="sex"><option value="" data-t="o_none"></option><option value="f" data-t="o_f"></option><option value="m" data-t="o_m"></option></select></label>
 <label><span data-t="f_h"></span><input type="number" id="h" min="100" max="230"></label>
 <label><span data-t="f_wt"></span><input type="number" id="wt" min="20" max="250"></label>
 <div></div>
 <div class="full"><span style="font-size:.9rem;color:var(--mut)" data-t="f_pain"></span>
  <div class="checks" id="mols"></div></div>
 <div class="full checks">
  <label><input type="checkbox" id="prev"><span data-t="c_prev"></span></label>
  <label><input type="checkbox" id="long"><span data-t="c_long"></span></label>
 </div>
</div>

<div class="stage" id="stage"></div>
<p class="tips" data-t="tips"></p>
<div class="consent">
 <label><input type="checkbox" id="ok1"><span data-t="ok1"></span></label>
 <label id="tut" style="display:none"><input type="checkbox" id="ok2"><span data-t="ok2"></span></label>
</div>
<button id="go" disabled data-t="go"></button>
<div class="bar" id="bar"><i id="pg"></i></div>
<div id="st"></div>

<section id="res">
 <h2 data-t="r_title"></h2>
 <div class="top"><div class="ring" id="ring"><span id="sc"></span></div>
  <div style="flex:1;min-width:240px"><b id="verd"></b><p id="sumy" style="margin:4px 0;color:var(--mut)"></p><div class="chips" id="okc"></div></div></div>
 <h2 data-t="r_card"></h2><div class="fich" id="fich"></div>
 <h2 data-t="r_err"></h2><div id="fl"></div><div id="ref"></div>
 <h2 data-t="r_shoe"></h2><div class="shoe" id="shoe"></div>
 <div class="note" data-h="note"></div>
 <button class="ghost" id="wipe" data-t="wipe"></button>
</section>

<h2 data-t="why"></h2>
<table>
 <tr><td data-t="tb1"></td><td><b data-t="n1"></b></td><td class="src">Roy et al., 2022</td></tr>
 <tr><td data-t="tb2"></td><td><b data-t="n2"></b></td><td class="src">Stenerson et al., 2023</td></tr>
 <tr><td data-t="tb3"></td><td><b data-t="n3"></b></td><td class="src">Generalitat de Catalunya, DMAF 2025</td></tr>
</table>
<p class="src" data-t="why_p"></p>
<footer data-t="foot"></footer>
</div>

sh_g4a:["Amb diverses compensacions, val la pena fer un estudi de la petjada amb un podòleg.","Con varias compensaciones, merece la pena hacer un estudio de la pisada con un podólogo.","With several compensations, a gait or footprint assessment with a podiatrist is worthwhile."],

async function load(){
 M=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
 const fs=await M.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
 const o=d=>({baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",delegate:d},runningMode:"VIDEO",numPoses:1});
 try{M.lmk=await M.PoseLandmarker.createFromOptions(fs,o("GPU"))}catch(e){M.lmk=await M.PoseLandmarker.createFromOptions(fs,o("CPU"))}}
function run(k,prog){return new Promise(async res=>{
 const v=$("#v_"+k),c=$("#c_"+k),x=c.getContext("2d"),du=new M.DrawingUtils(x),fr=[];let last=-1;
 c.width=v.videoWidth;c.height=v.videoHeight;v.controls=false;v.currentTime=0;v.playbackRate=1;
 v.onended=()=>{v.controls=true;x.clearRect(0,0,c.width,c.height);res({fr,W:v.videoWidth,H:v.videoHeight})};
 const loop=()=>{if(v.ended)return;
  if(v.currentTime!==last){last=v.currentTime;ts=Math.max(ts+1,performance.now()|0);
   const l=M.lmk.detectForVideo(v,ts).landmarks[0];x.clearRect(0,0,c.width,c.height);
   if(l){du.drawConnectors(l,M.PoseLandmarker.POSE_CONNECTIONS,{color:"#ffffffcc",lineWidth:3});du.drawLandmarks(l,{color:"#2447f5",radius:3});fr.push({t:last,lm:l})}
   prog(last/v.duration)}
  requestAnimationFrame(loop)};
 await v.play();loop()})}

/* ---------- càlculs ---------- */
const vis=(l,ids)=>ids.every(i=>(l[i].visibility??1)>.5);
const q=(a,p)=>{if(!a.length)return NaN;const s=[...a].sort((x,y)=>x-y);return s[Math.floor(p*(s.length-1))]};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;
const ang=(a,b,c)=>{const u={x:a.x-b.x,y:a.y-b.y},w={x:c.x-b.x,y:c.y-b.y};return Math.acos(Math.max(-1,Math.min(1,(u.x*w.x+u.y*w.y)/((Math.hypot(u.x,u.y)*Math.hypot(w.x,w.y))||1))))*57.3};

function front({fr,W,H}){const a={pel:[],sh:[],sw:[],wd:[],vl:[]};
 for(const f of fr){const l=f.lm;if(!vis(l,[11,12,23,24,25,26,27,28]))continue;
  const [ls,rs,lh,rh,lk,rk,la,ra]=[11,12,23,24,25,26,27,28].map(i=>({x:l[i].x*W,y:l[i].y*H}));
  const hw=Math.abs(lh.x-rh.x);if(hw<W*.02)continue;const mh=(lh.x+rh.x)/2;
  const tt=(p,r)=>Math.abs(Math.atan2(r.y-p.y,Math.abs(r.x-p.x)))*57.3;
  a.pel.push(tt(lh,rh));a.sh.push(tt(ls,rs));a.sw.push(((ls.x+rs.x)/2-mh)/hw);a.wd.push(Math.abs(la.x-ra.x)/hw);
  for(const [h,k,n,s] of [[lh,lk,la,lh.x>rh.x?1:-1],[rh,rk,ra,rh.x>lh.x?1:-1]]){
   const lx=h.x+(n.x-h.x)*(k.y-h.y)/((n.y-h.y)||1);a.vl.push(-(k.x-lx)*s/Math.hypot(n.x-h.x,n.y-h.y))}}
 return a}

function side({fr,W,H}){const a={ln:[],hd:[],k:[[],[]],S:[],bp:[]};let d=0;
 const ok=fr.filter(f=>vis(f.lm,[0,11,12,23,24,25,26,27,28]));
 for(const f of ok)d+=Math.sign(f.lm[0].x-(f.lm[23].x+f.lm[24].x)/2);d=d>=0?1:-1;
 for(const f of ok){const l=f.lm,g=i=>({x:l[i].x*W,y:l[i].y*H});
  const s={x:(g(11).x+g(12).x)/2,y:(g(11).y+g(12).y)/2},h={x:(g(23).x+g(24).x)/2,y:(g(23).y+g(24).y)/2},tl=Math.hypot(s.x-h.x,s.y-h.y);if(tl<10)continue;
  a.ln.push(Math.atan2((s.x-h.x)*d,h.y-s.y)*57.3);a.hd.push(((g(7).x+g(8).x)/2-s.x)*d/tl);
  a.k[0].push(180-ang(g(23),g(25),g(27)));a.k[1].push(180-ang(g(24),g(26),g(28)));
  a.bp.push((Math.max(g(27).y,g(28).y)-g(0).y)/.93);
  const sp=(g(27).x-g(28).x)*d,lead=sp>0?g(27):g(28),ll=(Math.hypot(g(23).x-g(27).x,g(23).y-g(27).y)+Math.hypot(g(24).x-g(28).x,g(24).y-g(28).y))/2;
  a.S.push({t:f.t,sp,ov:(lead.x-h.x)*d/ll})}
 const S=a.S,mx=Math.max(...S.map(s=>Math.abs(s.sp))),pk=[];
 for(let i=1;i<S.length-1;i++){const v=Math.abs(S[i].sp);if(v>.35*mx&&v>=Math.abs(S[i-1].sp)&&v>Math.abs(S[i+1].sp)&&(!pk.length||S[i].t-pk[pk.length-1].t>.25))pk.push(S[i])}
 a.cad=pk.length>2?(pk.length-1)/(pk[pk.length-1].t-pk[0].t)*60:NaN;a.ov=q(pk.map(p=>p.ov),.5);
 a.stp=q(pk.map(p=>Math.abs(p.sp)),.5)/q(a.bp,.5);return a}

/* vista posterior: inclinació del taló respecte de la tíbia (positiu = pronació) */
function back({fr,W,H}){const e=[[],[]];
 for(const f of fr){const l=f.lm;if(!vis(l,[23,24,25,26,27,28,29,30]))continue;
  const g=i=>({x:l[i].x*W,y:l[i].y*H}),m=(g(23).x+g(24).x)/2;
  [[23,25,27,29],[24,26,28,30]].forEach(([h,k,n,c],j)=>{const o=Math.sign(g(h).x-m)||1,K_=g(k),A=g(n),C=g(c);
   e[j].push((Math.atan2(C.x-A.x,C.y-A.y)-Math.atan2(A.x-K_.x,A.y-K_.y))*57.3*o)})}
 return avg([q(e[0],.5),q(e[1],.5)])}

function analyze(F,S,B){
 const m=q(F.wd,.5);
 const V={valgus:q(F.vl,.85),pelvis:q(F.pel,.9),shoulder:q(F.sh,.9),sway:q(F.sw,.95)-q(F.sw,.05),wide:m,narrow:m,
  fwd:avg(S.ln),bwd:-avg(S.ln),head:q(S.hd,.5),rom:(q(S.k[0],.95)-q(S.k[0],.05)+q(S.k[1],.95)-q(S.k[1],.05))/2,over:S.ov,cad:S.cad,pron:B,supin:-B};
 const out=[],oks=[];
 for(const [k,e] of Object.entries(K)){const v=V[k];if(!isFinite(v))continue;
  const sev=e.d*v>=e.d*e.b?2:e.d*v>=e.d*e.a?1:0;(sev?out:oks).push({k,e,v,sev})}
 return {bad:out.sort((x,y)=>y.sev-x.sev),oks,m:{step:S.stp,cad:S.cad}}}

/* ---------- informe ---------- */
const li=a=>"<ul>"+a.map(s=>"<li>"+s+"</li>").join("")+"</ul>";
function show({bad,oks,m},P){
 const hit=k=>P.mol.filter(z=>Z[z].includes(k)).map(z=>t("m_"+z));
 const sf=x=>x.replace("{s}",P.h?` (≈${Math.round(P.h*.25)} cm)`:"");
 const sc=Math.max(0,100-bad.reduce((n,b)=>n+b.sev*7,0)),col=sc>=80?"var(--ok)":sc>=60?"var(--mid)":"var(--bad)";
 $("#ring").style.background=`conic-gradient(${col} ${sc*3.6}deg,var(--line) 0)`;$("#sc").textContent=sc;
 $("#verd").textContent=t(sc>=80?"v_hi":sc>=60?"v_mid":"v_lo");
 $("#sumy").textContent=bad.length?t("sy_n").replace("{n}",bad.length):t("sy_0");
 $("#okc").innerHTML=oks.map(o=>`<span class="chip">✓ ${o.e.t[LI]}</span>`).join("");
 const fi=[[t("f_act"),t(["o_walk","o_run","o_both"][P.ai])],[t("f_age"),P.age],[t("f_sex"),P.sex?t("o_"+P.sex):"–"],[t("f_h"),P.h?P.h+" cm":"–"],[t("f_wt"),P.wt?P.wt+" kg":"–"],
  [t("f_pain"),P.mol.length?P.mol.map(z=>t("m_"+z)).join(", "):t("none")],[t("fi_step"),P.h&&isFinite(m.step)?"≈"+Math.round(m.step*P.h)+" cm":"–"],[t("f_cad"),isFinite(m.cad)?m.cad.toFixed(0)+" "+t("spm"):"–"]];
 $("#fich").innerHTML=fi.map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join("");
 $("#fl").innerHTML=bad.map(({k,e,v,sev})=>{const ex=[...e.ex[LI]];if(P.sex=="f"&&(k=="valgus"||k=="pelvis"))ex.push(t("ex_f"));
  return `<article class="f s${sev}"><h3>${e.t[LI]}${hit(k).length?`<span class="hit">${t("hit")}: ${hit(k).join(", ")}</span>`:""}</h3><div class="v">${t("sev"+sev)} · ${t("val")}: ${FM[e.f](v)}</div>
  <div class="cols"><div><h4>${t("col_now")}</h4>${li(e.now[LI])}</div><div><h4>${t("col_fut")}</h4>${li(e.fut[LI])}</div></div>
  <h4>${t("col_ex")}</h4>${li(ex.map(sf))}</article>`}).join("")||`<p>${t("r_none")}</p>`;
 const refer=bad.some(b=>b.sev==2)||P.mol.length||P.long||sc<60;
 $("#ref").innerHTML=refer?`<div class="note"><b>${t("ref_t")}</b> ${P.mol.length||P.long?t("ref_p1")+(P.long?t("ref_p2"):"")+". ":""}${P.prev?t("ref_p3")+" ":""}${t("ref_p4")}</div>`:`<div class="note">${t("ref_ok")}</div>`;
 const nS=bad.filter(b=>b.e.tag=="S").length,nC=bad.filter(b=>b.e.tag=="C").length,s=nS&&nC?"SC":nS?"S":nC?"C":"N";
 const X=[];if(P.ai>0)X.push(t("sh_run"));if(P.ai==0)X.push(t("sh_walk"));if(P.wt>=85)X.push(t("sh_wt"));
 $("#shoe").innerHTML=`<h3>${t("sh_"+s+"_t")}</h3><p>${t("sh_"+s+"_p")}</p>${li([...X,t("sh_g1"),t("sh_g2"),t("sh_g3"),t(nS>1?"sh_g4a":"sh_g4b")])}`;
 $("#res").style.display="block"}

$("#go").onclick=async()=>{
 const pg=$("#pg"),ks=["front","side"].concat(have.back?["back"]:[]),R={};
 $("#bar").style.display="block";$("#go").disabled=true;
 try{
  if(!M){st("st_load");await load()}
  for(let i=0;i<ks.length;i++){st("st_"+ks[i]);R[ks[i]]=await run(ks[i],p=>pg.style.width=(i+p)/ks.length*100+"%")}
  if(R.front.fr.length<20||R.side.fr.length<20){st("st_fail");return}
  const B=R.back&&R.back.fr.length>=20?back(R.back):NaN;
  const P={ai:+$("#act").value,age:+$("#age").value,sex:$("#sex").value,h:+$("#h").value||0,wt:+$("#wt").value||0,prev:$("#prev").checked,long:$("#long").checked,mol:[...document.querySelectorAll(".mol:checked")].map(c=>c.value)};
  last={r:analyze(front(R.front),side(R.side),B),P};show(last.r,last.P);$("#res").scrollIntoView({behavior:"smooth"});st("st_done");
 }catch(e){console.error(e);st("st_err")}finally{chk()}};

$("#wipe").onclick=()=>{for(const k of ["front","side","back"]){const v=$("#v_"+k);v.pause();URL.revokeObjectURL(v.src);v.removeAttribute("src");v.load();$("#w_"+k).classList.remove("on");$("#f_"+k).value="";have[k]=0}chk();st("st_wiped")};
apply();
</script>
</body>
</html>
