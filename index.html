<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PasÒptim</title>
<meta name="description" content="PasÒptim: anàlisi de la marxa amb vídeo, exercicis i calçat orientatiu.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0e2340;--teal:#0fb5a6;--teal2:#0a8f85;--bg:#f4f7f9;--card:#fff;--ink:#0e2340;--mut:#5a6b7b;--line:#dbe4ea;--ok:#1f9d6b;--mid:#e59a00;--bad:#d62e3a;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.55}
section[id],header[id]{scroll-margin-top:76px}
.w{max-width:1120px;margin:0 auto;padding:0 22px}
h1{font-size:clamp(2.5rem,6vw,4.4rem);line-height:1;font-weight:800;letter-spacing:-.035em;margin:14px 0 18px}
h2{font-size:clamp(1.8rem,3.4vw,2.6rem);line-height:1.08;letter-spacing:-.025em;margin:0 0 10px;font-weight:800}
h3{margin:0 0 6px;font-size:1.15rem}
.sub{color:var(--mut);font-size:1.1rem;max-width:62ch;margin:0 0 30px}
.sec{padding:88px 0}.alt{background:#fff}
.dark{background:var(--navy);color:#fff}.dark .sub{color:#b9c8d8}
/* nav */
.nav{position:sticky;top:0;z-index:50;background:#ffffffee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nv{display:flex;align-items:center;gap:18px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
.brand img{height:46px;width:auto}.brand b{color:var(--teal)}
#menu{display:flex;gap:4px;margin-left:auto}
#menu a{color:var(--navy);text-decoration:none;font-size:.95rem;padding:8px 12px;border-radius:10px}
#menu a:hover{background:var(--bg)}
.nr{display:flex;align-items:center;gap:10px}
.lang{display:flex;gap:2px;background:var(--bg);border-radius:999px;padding:3px}
.lang button{font:inherit;font-weight:700;font-size:.8rem;border:0;border-radius:999px;padding:5px 11px;background:none;color:var(--navy);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--navy);color:#fff}
#burger{display:none;border:0;background:var(--bg);border-radius:10px;width:42px;height:42px;cursor:pointer}
#burger span,#burger span:before,#burger span:after{display:block;width:20px;height:2px;background:var(--navy);margin:auto;position:relative;content:""}
#burger span:before{position:absolute;top:-6px;left:0}#burger span:after{position:absolute;top:6px;left:0}
@media(max-width:1020px){#burger{display:block}#menu{display:none;position:absolute;top:68px;left:0;right:0;background:#fff;flex-direction:column;padding:10px 22px 18px;border-bottom:1px solid var(--line);margin:0}#menu.open{display:flex}}
/* buttons */
.btn{display:inline-block;font:inherit;font-weight:700;text-decoration:none;border:0;border-radius:14px;padding:14px 26px;background:var(--teal);color:#fff;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{background:var(--teal2);transform:translateY(-1px)}
.btn.ghost{background:transparent;border:2px solid currentColor;color:inherit}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
/* hero */
.hero{background:radial-gradient(1200px 500px at 85% -10%,#15527a 0,transparent 60%),var(--navy);color:#fff;padding:72px 0 84px;overflow:hidden}
.hg{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
@media(max-width:900px){.hg{grid-template-columns:1fr}}
.pill{display:inline-block;background:#ffffff1a;border:1px solid #ffffff33;border-radius:999px;padding:5px 14px;font-size:.85rem}
.hero .lead{font-size:1.2rem;color:#c9d7e5;max-width:54ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0}
.trust{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px 20px;color:#b9c8d8;font-size:.92rem}
.trust li:before{content:"✓ ";color:var(--teal)}
.hv{position:relative;background:#ffffff0f;border:1px solid #ffffff22;border-radius:28px;padding:20px;aspect-ratio:1/1.05}
.hv svg{width:100%;height:100%}
.fc{position:absolute;background:#fff;color:var(--navy);font-weight:700;font-size:.85rem;border-radius:12px;padding:6px 12px;box-shadow:0 8px 24px #0005;animation:fl 4s ease-in-out infinite}
.c1{top:16%;left:-4%}.c2{top:46%;right:-3%;animation-delay:-1.3s}.c3{bottom:14%;left:2%;animation-delay:-2.6s}
@keyframes fl{50%{transform:translateY(-8px)}}
.th,.sh,.ar,.al{transform-box:view-box;animation-duration:1.2s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-direction:alternate}
.th{transform-origin:100px 150px;animation-name:th}.sh{transform-origin:100px 215px;animation-name:sh}
.ar{transform-origin:100px 74px;animation-name:ar}
.b{animation-delay:-1.2s}
@keyframes th{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes sh{from{transform:rotate(0)}to{transform:rotate(-34deg)}}
@keyframes ar{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
/* cards */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.grid3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px}
.alt .card{background:var(--bg);border-color:transparent}
.dark .card{background:#ffffff0f;border-color:#ffffff22}
.num{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--teal);color:#fff;font-weight:800;margin-bottom:12px}
.card p{margin:0;color:var(--mut)}.dark .card p{color:#b9c8d8}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.th,.sh,.ar,.fc{animation:none}html{scroll-behavior:auto}}
/* demo */
.demo{display:grid;grid-template-columns:.9fr 1.1fr;gap:28px;align-items:start}
@media(max-width:900px){.demo{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{font:inherit;font-weight:600;border:2px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:8px 18px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.fig{background:linear-gradient(160deg,#eaf6f5,#f4f7f9);border-radius:24px;padding:12px;aspect-ratio:1/1.1}
.fig svg{width:100%;height:100%}
.src{color:var(--mut);font-size:.85rem}
.gg{margin:16px 0}.gh{display:flex;justify-content:space-between;gap:10px;font-size:.95rem}
.gw{position:relative;margin-top:8px}
.gz{display:flex;height:10px;border-radius:9px;overflow:hidden}.gz i{display:block;height:100%}
.gm{position:absolute;top:-4px;width:5px;height:18px;border-radius:3px;background:var(--navy);transform:translateX(-50%);border:1px solid #fff}
.s0{color:var(--ok)}.s1{color:var(--mid)}.s2{color:var(--bad)}
/* form + tool */
.form{background:var(--card);border-radius:22px;padding:22px;margin:0 0 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px 16px;border:1px solid var(--line)}
.form label{display:flex;flex-direction:column;font-size:.9rem;color:var(--mut);gap:4px}
.form input,.form select,.fm input,.fm select,.fm textarea{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.form .full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:4px}
.checks label,.consent label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);display:flex}
.checks input,.consent input{width:auto}
.stage{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:800px){.stage,.form{grid-template-columns:1fr}}
.slot{background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:16px}
.slot b{display:block;font-size:1.05rem}.slot small{color:var(--mut)}
.vw{position:relative;margin-top:10px;border-radius:12px;overflow:hidden;background:#0003;aspect-ratio:3/4;display:none}
.vw.on{display:block}.vw video,.vw canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pick{display:inline-block;margin-top:8px;padding:9px 16px;border-radius:999px;background:var(--navy);color:#fff;font-weight:600;cursor:pointer}
.pick:focus-within{outline:3px solid var(--teal);outline-offset:2px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.tips{color:var(--mut);font-size:.95rem;margin:16px 0}
.consent{margin:14px 0;display:flex;flex-direction:column;gap:8px;font-size:.95rem}
.consent label{align-items:flex-start}
.bar{height:8px;border-radius:9px;background:var(--line);margin-top:14px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .2s}
#st{color:var(--mut);margin-top:8px;min-height:1.5em}
#res{display:none;margin-top:40px}
#res h3.rt{font-size:1.5rem;margin:36px 0 12px}
.top{display:flex;gap:28px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:22px;padding:24px;border:1px solid var(--line)}
.ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring span{width:98px;height:98px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:2.2rem;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}.chip{font-size:.85rem;padding:3px 10px;border-radius:999px;background:var(--bg)}
.fich{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:800px){.fich{grid-template-columns:1fr 1fr}}
.fich div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.fich small{display:block;color:var(--mut);font-size:.8rem}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:4px 30px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:8px 24px}
@media(max-width:800px){.gl{grid-template-columns:1fr}}
.f{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:12px 0;border-left:8px solid var(--mid)}.f.s2{border-left-color:var(--bad)}
.f .v{color:var(--mut);font-size:.95rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin-top:10px}@media(max-width:700px){.cols{grid-template-columns:1fr}}
.f h4{margin:10px 0 2px;font-size:.95rem}.f ul{margin:0;padding-left:18px}
.hit{display:inline-block;margin-left:8px;font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--teal);color:#fff;vertical-align:middle}
.note{background:var(--card);border-left:8px solid var(--teal);border-radius:14px;padding:14px 18px;margin:12px 0;font-size:.95rem;border:1px solid var(--line);border-left-width:8px}
.shoe{background:var(--navy);color:#fff;border-radius:24px;padding:28px}.shoe h3{font-size:1.6rem}.shoe p{color:#c9d7e5}
.sp{display:grid;gap:8px;margin:14px 0}.sp div{display:grid;grid-template-columns:130px 1fr 60px;gap:10px;align-items:center;font-size:.9rem}
.sp i{height:8px;background:#ffffff26;border-radius:9px;overflow:hidden}.sp b{display:block;height:100%;background:var(--teal);border-radius:9px}.sp em{font-style:normal;color:#b9c8d8;text-align:right}
.shoe ul{padding-left:18px;margin:10px 0 0}
.ghost2{font:inherit;background:none;border:2px solid var(--navy);color:var(--navy);border-radius:12px;padding:8px 16px;cursor:pointer;margin:14px 10px 0 0}
/* misc sections */
.g23{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}@media(max-width:900px){.g23{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}@media(max-width:900px){.split{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;background:#ffffff0f;border-radius:14px;overflow:hidden;font-size:.95rem}
td,th{padding:10px 14px;text-align:left;border-bottom:1px solid #ffffff22}
.dark .src{color:#9fb2c6}
.lim{margin:0;padding-left:18px;color:#c9d7e5}
.chart{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0}
.hl{list-style:none;padding:0;margin:0 0 6px}.hl li{padding:4px 0}
.ct{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink)}.ct td,.ct th{border-bottom:1px solid var(--line)}
.fm{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}.fm label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--mut)}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin:10px 0}
summary{font-weight:700;cursor:pointer}details p{margin:10px 0 0;color:var(--mut)}
footer{background:var(--navy);color:#b9c8d8;padding:40px 0;font-size:.9rem}footer .brand{color:#fff;margin-bottom:12px}
</style>
</head>

   <g class="th b"><path d="M100 150V215" opacity=".55"/><g class="sh b"><path d="M100 215V278" opacity=".55"/><path d="M100 278L122 280" stroke-width="6" opacity=".55"/></g></g>
   <circle cx="100" cy="150" r="7" fill="#0fb5a6" stroke="none"/>
  </g></svg>

async function load(){
 M={...(await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"))};
 const fs=await M.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
 const o=d=>({baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",delegate:d},runningMode:"VIDEO",numPoses:1});
 try{M.lmk=await M.PoseLandmarker.createFromOptions(fs,o("GPU"))}catch(e){M.lmk=await M.PoseLandmarker.createFromOptions(fs,o("CPU"))}}
function run(k,prog){return new Promise(async res=>{
 const v=$("#v_"+k),c=$("#c_"+k),x=c.getContext("2d"),du=new M.DrawingUtils(x),fr=[];let last=-1;
 c.width=v.videoWidth;c.height=v.videoHeight;v.controls=false;v.currentTime=0;v.playbackRate=1;
 v.onended=()=>{v.controls=true;x.clearRect(0,0,c.width,c.height);res({fr,W:v.videoWidth,H:v.videoHeight})};
 const loop=()=>{if(v.ended)return;
  if(v.currentTime!==last){last=v.currentTime;ts=Math.max(ts+1,performance.now()|0);
   const l=M.lmk.detectForVideo(v,ts).landmarks[0];x.clearRect(0,0,c.width,c.height);
   if(l){du.drawConnectors(l,M.PoseLandmarker.POSE_CONNECTIONS,{color:"#ffffffcc",lineWidth:3});du.drawLandmarks(l,{color:"#2447f5",radius:3});fr.push({t:last,lm:l})}
   prog(last/v.duration)}
  requestAnimationFrame(loop)};
 await v.play();loop()})}

/* ---------- càlculs ---------- */
const vis=(l,ids)=>ids.every(i=>(l[i].visibility??1)>.5);
const q=(a,p)=>{if(!a.length)return NaN;const s=[...a].sort((x,y)=>x-y);return s[Math.floor(p*(s.length-1))]};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;
const ang=(a,b,c)=>{const u={x:a.x-b.x,y:a.y-b.y},w={x:c.x-b.x,y:c.y-b.y};return Math.acos(Math.max(-1,Math.min(1,(u.x*w.x+u.y*w.y)/((Math.hypot(u.x,u.y)*Math.hypot(w.x,w.y))||1))))*57.3};

function front({fr,W,H}){const a={pel:[],sh:[],sw:[],wd:[],vl:[]};
 for(const f of fr){const l=f.lm;if(!vis(l,[11,12,23,24,25,26,27,28]))continue;
  const [ls,rs,lh,rh,lk,rk,la,ra]=[11,12,23,24,25,26,27,28].map(i=>({x:l[i].x*W,y:l[i].y*H}));
  const hw=Math.abs(lh.x-rh.x);if(hw<W*.02)continue;const mh=(lh.x+rh.x)/2;
  const tt=(p,r)=>Math.abs(Math.atan2(r.y-p.y,Math.abs(r.x-p.x)))*57.3;
  a.pel.push(tt(lh,rh));a.sh.push(tt(ls,rs));a.sw.push(((ls.x+rs.x)/2-mh)/hw);a.wd.push(Math.abs(la.x-ra.x)/hw);
  for(const [h,k,n,s] of [[lh,lk,la,lh.x>rh.x?1:-1],[rh,rk,ra,rh.x>lh.x?1:-1]]){
   const lx=h.x+(n.x-h.x)*(k.y-h.y)/((n.y-h.y)||1);a.vl.push(-(k.x-lx)*s/Math.hypot(n.x-h.x,n.y-h.y))}}
 return a}

function side({fr,W,H}){const a={ln:[],hd:[],k:[[],[]],S:[],bp:[]};let d=0;
 const ok=fr.filter(f=>vis(f.lm,[0,11,12,23,24,25,26,27,28]));
 for(const f of ok)d+=Math.sign(f.lm[0].x-(f.lm[23].x+f.lm[24].x)/2);d=d>=0?1:-1;
 for(const f of ok){const l=f.lm,g=i=>({x:l[i].x*W,y:l[i].y*H});
  const s={x:(g(11).x+g(12).x)/2,y:(g(11).y+g(12).y)/2},h={x:(g(23).x+g(24).x)/2,y:(g(23).y+g(24).y)/2},tl=Math.hypot(s.x-h.x,s.y-h.y);if(tl<10)continue;
  a.ln.push(Math.atan2((s.x-h.x)*d,h.y-s.y)*57.3);a.hd.push(((g(7).x+g(8).x)/2-s.x)*d/tl);
  a.k[0].push(180-ang(g(23),g(25),g(27)));a.k[1].push(180-ang(g(24),g(26),g(28)));
  a.bp.push((Math.max(g(27).y,g(28).y)-g(0).y)/.93);
  const sp=(g(27).x-g(28).x)*d,lead=sp>0?g(27):g(28),ll=(Math.hypot(g(23).x-g(27).x,g(23).y-g(27).y)+Math.hypot(g(24).x-g(28).x,g(24).y-g(28).y))/2;
  a.S.push({t:f.t,sp,ov:(lead.x-h.x)*d/ll})}
 const S=a.S,mx=Math.max(...S.map(s=>Math.abs(s.sp))),pk=[];
 for(let i=1;i<S.length-1;i++){const v=Math.abs(S[i].sp);if(v>.35*mx&&v>=Math.abs(S[i-1].sp)&&v>Math.abs(S[i+1].sp)&&(!pk.length||S[i].t-pk[pk.length-1].t>.25))pk.push(S[i])}
 a.cad=pk.length>2?(pk.length-1)/(pk[pk.length-1].t-pk[0].t)*60:NaN;a.ov=q(pk.map(p=>p.ov),.5);
 a.stp=q(pk.map(p=>Math.abs(p.sp)),.5)/q(a.bp,.5);return a}

/* vista posterior: inclinació del taló respecte de la tíbia (positiu = pronació) */
function back({fr,W,H}){const e=[[],[]];
 for(const f of fr){const l=f.lm;if(!vis(l,[23,24,25,26,27,28,29,30]))continue;
  const g=i=>({x:l[i].x*W,y:l[i].y*H}),m=(g(23).x+g(24).x)/2;
  [[23,25,27,29],[24,26,28,30]].forEach(([h,k,n,c],j)=>{const o=Math.sign(g(h).x-m)||1,K_=g(k),A=g(n),C=g(c);
   e[j].push((Math.atan2(C.x-A.x,C.y-A.y)-Math.atan2(A.x-K_.x,A.y-K_.y))*57.3*o)})}
 return avg([q(e[0],.5),q(e[1],.5)])}

function evalV(V){const bad=[],oks=[];
 for(const [k,e] of Object.entries(K)){const v=V[k];if(!isFinite(v))continue;
  const sev=e.d*v>=e.d*e.b?2:e.d*v>=e.d*e.a?1:0;(sev?bad:oks).push({k,e,v,sev})}
 return {bad:bad.sort((x,y)=>y.sev-x.sev),oks}}
function analyze(F,S,B){
 const m=q(F.wd,.5);
 const V={valgus:q(F.vl,.85),pelvis:q(F.pel,.9),shoulder:q(F.sh,.9),sway:q(F.sw,.95)-q(F.sw,.05),wide:m,narrow:m,
  fwd:avg(S.ln),bwd:-avg(S.ln),head:q(S.hd,.5),rom:(q(S.k[0],.95)-q(S.k[0],.05)+q(S.k[1],.95)-q(S.k[1],.05))/2,over:S.ov,cad:S.cad,pron:B,supin:-B};
 return {...evalV(V),V,m:{step:S.stp,cad:S.cad}}}

function gauge(k,v){const e=K[k],hi=e.d==1,mx=hi?e.b*1.7:e.a*2.2,pct=Math.max(0,Math.min(100,v/mx*100));
 const z=hi?[[e.a,"ok"],[e.b-e.a,"mid"],[mx-e.b,"bad"]]:[[e.b,"bad"],[e.a-e.b,"mid"],[mx-e.a,"ok"]];
 const sev=hi?(v>=e.b?2:v>=e.a?1:0):(v<=e.b?2:v<=e.a?1:0);
 return `<div class="gg"><div class="gh"><span>${e.t[LI]}</span><b class="s${sev}">${FM[e.f](v)}</b></div><div class="gw"><div class="gz">${z.map(([w,c])=>`<i style="width:${w/mx*100}%;background:var(--${c})"></i>`).join("")}</div><span class="gm" style="left:${pct}%"></span></div></div>`}

function findHTML(bad,P){
 const hit=k=>P.mol.filter(z=>Z[z].includes(k)).map(z=>t("m_"+z));
 const sf=x=>x.replace("{s}",P.h?` (≈${Math.round(P.h*.25)} cm)`:"");
 return bad.map(({k,e,v,sev})=>{const ex=[...e.ex[LI]];if(P.sex=="f"&&(k=="valgus"||k=="pelvis"))ex.push(t("ex_f"));
  return `<article class="f s${sev}"><h3>${e.t[LI]}${hit(k).length?`<span class="hit">${t("hit")}: ${hit(k).join(", ")}</span>`:""}</h3><div class="v">${t("sev"+sev)} · ${t("val")}: ${FM[e.f](v)}</div>
  <div class="cols"><div><h4>${t("col_now")}</h4>${li(e.now[LI])}</div><div><h4>${t("col_fut")}</h4>${li(e.fut[LI])}</div></div>
  <h4>${t("col_ex")}</h4>${li(ex.map(sf))}</article>`}).join("")||`<p>${t("r_none")}</p>`}

const PL=["cush","stab","drop","rock","flex","toe","wei","heel"];
function shoeHTML(bad,P){
 const nS=bad.filter(b=>b.e.tag=="S").length,nC=bad.filter(b=>b.e.tag=="C").length,s=nS&&nC?"SC":nS?"S":nC?"C":"N";
 const p={cush:50,stab:45,drop:50,rock:40,flex:55,toe:50,wei:55,heel:50},up=(k,v)=>p[k]=Math.min(95,v);
 if(nS){up("stab",85);up("heel",85);up("flex",40);up("toe",70)}
 if(nC){up("cush",80);up("rock",80);up("drop",70);up("flex",45)}
 if(P.ai>0)up("cush",p.cush+10);if(P.wt>=85){up("cush",p.cush+10);p.wei=40}if(P.ai==0){up("flex",p.flex+15);up("wei",p.wei+15)}
 const X=[];if(P.ai>0)X.push(t("sh_run"));if(P.ai==0)X.push(t("sh_walk"));if(P.wt>=85)X.push(t("sh_wt"));
 return `<h3>${t("sh_"+s+"_t")}</h3><p>${t("sh_"+s+"_p")}</p><div class="sp">${PL.map(k=>`<div><span>${t("p_"+k)}</span><i><b style="width:${p[k]}%"></b></i><em>${t(p[k]<40?"lv1":p[k]<70?"lv2":"lv3")}</em></div>`).join("")}</div>${li([...X,t("sh_g1"),t("sh_g2"),t("sh_g3"),t(nS>1?"sh_g4a":"sh_g4b")])}`}

/* figura esquemàtica segons la vista */
function figure(vw,V){const R=Math.PI/180,f=n=>n.toFixed(1),
 ln=(a,b,c="#0e2340",w=8)=>`<path d="M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" fill="none"/>`,
 dot=p=>`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="6.5" fill="#0fb5a6" stroke="#fff" stroke-width="2.5"/>`;let s="",pts=[];
 if(vw=="side"){const th=V.fwd*R,hip=[110,170],sh=[hip[0]+95*Math.sin(th),hip[1]-95*Math.cos(th)],hd=[sh[0]+30*Math.sin(th)+V.head*40,sh[1]-30*Math.cos(th)];
  const a1=[hip[0]+V.over*95,hip[1]+112],k1=[(hip[0]+a1[0])/2+(55-V.rom)*.7+14,hip[1]+58],a2=[hip[0]-52,hip[1]+98],k2=[hip[0]-8,hip[1]+66];
  s=ln(hip,sh)+`<circle cx="${f(hd[0])}" cy="${f(hd[1])}" r="16" fill="#0e2340"/>`+ln(hip,k1)+ln(k1,a1)+ln(hip,k2,"#4a6079")+ln(k2,a2,"#4a6079")+ln(a1,[a1[0]+22,a1[1]+2],"#0e2340",6)+ln(a2,[a2[0]+22,a2[1]-4],"#4a6079",6);pts=[hip,sh,k1,a1,k2,a2]}
 else if(vw=="front"){const pt=V.pelvis*R,st=V.shoulder*R,hy=170,hl=[78,hy-22*Math.sin(pt)],hr=[142,hy+22*Math.sin(pt)],sl=[72,82-30*Math.sin(st)],sr=[148,82+30*Math.sin(st)],w=V.wide*24,
   kl=[hl[0]+V.valgus*260,hl[1]+62],kr=[hr[0]-V.valgus*260,hr[1]+62],al=[110-w-12,hl[1]+120],ar=[110+w+12,hr[1]+120];
  s=ln(sl,sr)+ln([110,82],[110,170])+`<circle cx="110" cy="52" r="16" fill="#0e2340"/>`+ln(hl,hr)+ln(hl,kl)+ln(kl,al)+ln(hr,kr)+ln(kr,ar);pts=[sl,sr,hl,hr,kl,kr,al,ar]}
 else{const pr=V.pron*R,hl=[88,170],hr=[132,170],kl=[88,232],kr=[132,232],al=[88,290],ar=[132,290];
  s=ln([110,170],[110,84])+`<circle cx="110" cy="54" r="16" fill="#0e2340"/>`+ln([60,84],[160,84])+ln(hl,hr)+ln(hl,kl)+ln(kl,al)+ln(hr,kr)+ln(kr,ar)+ln(al,[al[0]-Math.sin(pr)*20,al[1]+Math.cos(pr)*20],"#0fb5a6",7)+ln(ar,[ar[0]+Math.sin(pr)*20,ar[1]+Math.cos(pr)*20],"#0fb5a6",7);pts=[hl,hr,kl,kr,al,ar]}
 return `<svg viewBox="0 0 220 320"><line x1="10" y1="312" x2="210" y2="312" stroke="#cfd8e0" stroke-width="3"/>${s}${pts.map(dot).join("")}</svg>`}

 document.documentElement.lang=["ca","es","en"][LI];document.title=t("title");

/* ---------- navegació i animacions ---------- */
$("#burger").onclick=()=>{const o=$("#menu").classList.toggle("open");$("#burger").setAttribute("aria-expanded",o)};
$$("#menu a").forEach(a=>a.onclick=()=>{$("#menu").classList.remove("open");$("#burger").setAttribute("aria-expanded",false)});
if("IntersectionObserver" in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.15});$$(".rv").forEach(e=>io.observe(e))}else $$(".rv").forEach(e=>e.classList.add("in"));

/* ---------- formulari i vídeos ---------- */
const chk=()=>{const a=+$("#age").value;$("#tut").style.display=a>0&&a<18?"flex":"none";$("#go").disabled=!(have.front&&have.side&&$("#ok1").checked&&a>=8&&(a>=18||$("#ok2").checked))};
for(const k of ["front","side","back"]){$("#f_"+k).onchange=e=>{const f=e.target.files[0];if(!f)return;$("#v_"+k).src=URL.createObjectURL(f);$("#w_"+k).classList.add("on");have[k]=1;chk()}}
["#age","#ok1","#ok2"].forEach(x=>$(x).oninput=chk);

$("#go").onclick=async()=>{
 const pg=$("#pg"),ks=["front","side"].concat(have.back?["back"]:[]),R={};
 $("#bar").style.display="block";$("#go").disabled=true;
 try{
  if(!M||!M.lmk){st("st_load");await load()}
  for(let i=0;i<ks.length;i++){st("st_"+ks[i]);R[ks[i]]=await run(ks[i],p=>pg.style.width=(i+p)/ks.length*100+"%")}
  if(R.front.fr.length<20||R.side.fr.length<20){st("st_fail");return}
  const B=R.back&&R.back.fr.length>=20?back(R.back):NaN;
  const P={ai:+$("#act").value,age:+$("#age").value,sex:$("#sex").value,h:+$("#h").value||0,wt:+$("#wt").value||0,prev:$("#prev").checked,long:$("#long").checked,mol:$$(".mol:checked").map(c=>c.value)};
  last={r:analyze(front(R.front),side(R.side),B),P};show(last.r,last.P);$("#res").scrollIntoView({behavior:"smooth"});st("st_done");
 }catch(e){console.error(e);st("st_err")}finally{chk()}};

$("#wipe").onclick=()=>{for(const k of ["front","side","back"]){const v=$("#v_"+k);v.pause();URL.revokeObjectURL(v.src);v.removeAttribute("src");v.load();$("#w_"+k).classList.remove("on");$("#f_"+k).value="";have[k]=0}chk();st("st_wiped")};
apply();

</script>
